   item_name: Метод экстремальных матриц для внешней оценки множества решений интервальных систем линейных алгебраических уравнений
   item_authors_address: |
     <b>К. Ф. Иванова</b>, канд. техн. наук, постдокторант, klara.i2010@yandex.ru,
     Санкт-Петербургский государственный университет
   item_rec_on: 2025-11-19
   item_acc_on: 2026-03-12
   item_annot: |
     <p>Представлен специализированный новый эвристический метод для внешнего оценивания объединенного множества решений интервальной системы линейных алгебраических уравнений (ИСЛАУ). Метод экстремальных матриц (МЭМ) основан на вершинных реализациях интервальных матриц, формализованных из произведений элементов и их алгебраических дополнений. Показаны условия появления ограниченного подмножества экстремальных матриц, обладаю­щих идентичными характеристиками. На базе сформированных матриц находятся оптимальные векторы правых частей. Решение сконструированных вещественных систем уравнений обуславливает нахождение максимальных координат многогранника отклонений неизвестных в пространстве Rn, определяющих внешнее оценивание множества решений ИСЛАУ.
     Проведено теоретическое обоснование и доказана теорема существования экстремальных матриц. Обозначены классы ИСЛАУ, адаптированные для исследования.
     Эффективность метода определяется существенным сокращением числа алгебраических уравнений при вычислении внешних оценок2множества решений ИСЛАУ и заменой решения задачи с экспоненциальной сложностью O(2n ) на полиномиальную О(п3).
     Показано влияние структурных свойств матриц отдельных подклассов интервальных систем на оценки решений.
     Точность оценок метода экстремальных матриц сравнивается с результатами, полученными при программной реализации интервальных методов с использованием функций библиотеки IntvalPy.
     Метод не гарантирует высокой точности, но позволяет получать сопоставимые оценки для разных классов интервальных линейных алгебраических систем по сравнению с основными интервальными методами.
     Консервативные оценки МЭМ могут быть использованы как базисные при оценке точными методами.</p>
