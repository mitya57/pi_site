   item_rec_on: 2026-03-30
   item_acc_on: 2026-05-14
   item_annot: |
     <p>Рассмотрен нормативный расчет учебной нагрузки в информационной системе образовательной организации. Предложена формальная модель, которая связывает строки рабочих учебных планов, сведения о контингенте, потоки, подгруппы, ручные уточнения и профиль коэффициентов нагрузки. Показано, как исходные строки преобразуются в расчетные строки, как вычисляются частные компоненты нагрузки и как формируются итоговые значения. В программной реализации выделены слои получения данных, нормализации, расчетного ядра, хранения версий и контроля результатов. Новизна работы состоит в формальном сохранении связи между строкой рабочего учебного плана, правилом преобразования, версией расчета и итоговой строкой нагрузки. Практической базой работы служит информационная система, разработанная одним из авторов статьи. Эксплуатационная проверка в статье приведена на данных Санкт-Петербургского государственного морского технического университета. Использование аналогичных решений в двух других университетах показывает переносимость подхода. Приведен проверочный числовой пример. Практическое преимущество модели состоит в том, что пользователь может сразу увидеть расчет итоговой нагрузки, проверить его и при необходимости уточнить структуру потоков.</p>
