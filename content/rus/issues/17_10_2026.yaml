   item_annot: |
     <p>Рассмотрены вопросы проектирования и реализации ассистента «ПРОПС-ИА» образовательной платформы «ПРОПС» на основе технологии генерации с дополненной выборкой. Обоснована актуальность перехода от статичных систем управления обучением к адаптивным средам, использующим большие языковые модели для формирования индивидуальных образовательных траекторий. Описан технологический цикл работы ассистента «ПРОПС-ИА», включающий использование модели Llama 3.1, векторных баз данных и механизмов семантического сопоставления.
     Особое внимание уделено методу динамического формирования шаблонов текстовых запросов, которые учитывают когнитивную нагрузку обучающегося, контекст диалога и педагогические цели. Научная новизна исследования заключается в реализации принципа динамической тематической гранулярности контента, обеспечивающего автоматическое ветвление тематических узлов внутри компетенций без предварительной настройки жестких иерархий. Авторами показано, что интеграция RAG-модуля позволяет минимизировать риск генеративных галлюцинаций и обеспечить фактологическую точность учебных материалов. Результаты исследования подтвердили эффективность использования RAG-архитектур для создания масштабируемых интеллектуальных образовательных систем нового поколения.</p>
