   item_annot: |
     <p>Представлены результаты исследований и сравнительный анализ двух подходов к оценке сонливости водителя по видеопотоку: классического метода на основе сверточной нейронной сети (CNN) и гибридного метода, дополняющего нейросетевой классификатор геометрическими биометрическими признаками лица. В качестве базовой архитектуры использована MobileNetV3-Large. Биометрические признаки (EAR, MAR, углы ориентации головы) извлекаются с помощью библиотеки компьютерного зрения MediaPipe Face Mesh. Предложен адаптивный механизм слияния модальностей (Fusion Gate), динамически взвешивающий вклад визуальных и биометрических признаков. Интеграция биометрии позволила добиться точности 98,7 % (F1 = 0,987) по сравнению с базовой моделью CNN, показавшей точность 96,0 % (F1 = 0,958). Результаты обосновывают целесообразность применения гибридных архитектур в системах мониторинга состояния водителя.</p>
