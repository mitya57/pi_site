   item_annot: |
     <p>В данных о публикационной активности систематически появляются ошибки, связанные с некорректным определением имен и фамилий для китайских авторов. Это в значительной степени обусловлено расхождениями между традиционным китайским («Фамилия Имя») и западным («Имя Фамилия») порядком следования компонентов имени, множественностью систем романизации и так называемой «двойной неоднозначностью», при которой обе части имени могут определяться как фамилии.
     Предложено описание настраиваемой детерминированной модели верификации порядка компонентов имени, реализованной как процедура агрегации интерпретируемых доказательств на основе скоринговой логики с калибруемыми весами, порогами и предварительной проверкой китайской языковой совместимости имени.</p>
