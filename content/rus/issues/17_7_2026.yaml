   item_rec_on: 2025-11-21
   item_acc_on: 2026-01-27
   item_annot: |
     <p>Рассмотрены методы анализа городской транспортной сети на основе построения взвешенного графа, отражающего временные характеристики движения. Предложен подход к оценке связности улично-дорожной сети, основанный на вычислении матрицы близости с использованием гауссовой функции сходства и последующем кластерном анализе транспортных связей. Дан анализ влияния выбора параметров функции сходства и локального масштабирования на характеристики кластерной структуры транспортного графа, включая устойчивость и интерпретируемость получаемых разбиений.
     В отличие от традиционных моделей с фиксированным параметром сглаживания предложено применение самонастраивающегося гауссова ядра, в котором параметр масштаба определяется индивидуально для каждой вершины на основе характеристик ее локальной окрестности. Такой подход обеспечивает адаптивное распределение весов связей и позволяет корректно учитывать пространственную неоднородность городской транспортной сети.
     Для выявления функциональных зон города используется алгоритм Leiden, оптимизирующий модулярность кластерной структуры. Проведено сравнение результатов кластеризации для различных уровней дорожной загруженности, отражающих изменение условий движения от свободного к высоконагруженному режиму.
     Экспериментальные результаты показывают, что по сравнению с моделями с фиксированным параметром сглаживания предложенный подход обеспечивает более устойчивые кластерные разбиения транспортного графа и позволяет выявлять закономерности изменения структуры связей при варьировании транспортных условий. Визуализация распределения весов и кластерных структур подтверждает чувствительность модели к изменению дорожной ситу­ации. Разработанный подход может быть использован для анализа транспортной связности городских территорий и исследования пространственно-временных паттернов городской мобильности.</p>
