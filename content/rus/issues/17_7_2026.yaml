   item_annot: |
     <p>Предложены математическая модель и алгоритм анализа эмоций. Описаны результаты разработки программного комплекса для анализа эмоционального состояния обучающегося в иммерсивной среде. Осуществлен сравнительный анализ существующих решений для распознавания эмоциональных состояний, по результатам которого выбрана библиотека py-feat (модуль Detector) как наиболее соответствующая требованиям комплексности анализа и исследовательской воспроизводимости. Проведенный эксперимент по оценке эмоционального состояния пользователя при работе с мультимедийным симулятором выявил доминирование негативных аффективных состояний. Полученные данные интерпретированы в контексте концепции статусных функций, которые являются временными комплексно-значными функциями, образующими ортонормированный базис допустимых состояний системы. Это позволило выявить систематическое смещение нейтрального статуса в зону фрустрации.</p>
