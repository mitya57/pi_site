   item_name: Анализ связности городской транспортной сети с использованием самонастраивающегося гауссова ядра
   item_authors_address: |
     <b>Н. Д. Поваляев</b>, аспирант, nikita03565@gmail.com,
     <b>А. Ю. Крылатов</b>, д-р физ.-мат. наук, проф., зав. каф., a.krylatov@spbu.ru,
