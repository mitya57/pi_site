     <p>Представлена архитектура интеллектуального агента для управления автономным транспортным средством на основе мультимодальных данных. Данный подход основан на сочетании визуальных признаков (карты глубины и паноптической сегментации), навигационных и контекстных параметров, а также временных рядов управляющих сигналов и индикаторов критических событий. Мультимодальное слияние данных обеспечивает детальное восприятие окружающей среды и ее семантики, позволяет учитывать текущую цель и дорожную ситуацию, моделировать динамику движения и принимать последовательные управляющие решения.
     Модель реализована в симуляторе CARLA с использованием имитационного обучения. Архитектура включает отдельные модули кодирования для разных типов входных данных, механизм их объединения и три выходных блока предсказания, каждый из которых независимо предсказывает одну из управляющих переменных: рулевое управление, газ и тормоз.
     Полученные результаты подтверждают эффективность предложенного комплексного подхода и создают основу для дальнейшего развития систем такого рода.</p>
