   item_name: Прогнозирование спроса на ИТ-навыки в Восточной Африке на основе модели BERT
   item_authors_address: |
     <b>Р. Ндунги</b>, студент, rebeccahndungi94@gmail.com,
     <b>И. С. Блеканов</b>, канд. техн. наук, доц., зав. каф. технологий программирования, i.blekanov@spbu.ru,
     Санкт-Петербургский государственный университет, Санкт-Петербург, 199034, Российская Федерация
   item_rec_on: 2026-02-20
   item_acc_on: 2026-03-31
   item_annot: |
     <p>Данное исследование помогает решить проблему несоответствия между спросом и предложением ИТ-навыков в Восточной Африке. Предложена новая структура прогнозирования на основе модели BERT. Существующие системы анализа рынка труда дают лишь ретроспективные данные. Разработана и валидирована структура прогнозной аналитики для прогнозирования спроса на ИТ-навыки. Методология использует контекстно-настроенную модель BERT для семантического анализа неструктурированных данных с региональных рынков труда. Это позволяет извлекать и категоризировать ИТ-компетенции из текста. Результаты прогнозирования показывают: спрос на Excel-навыки остается высоким, но его рост замедлен (мультипликатор 0,05x). При этом спрос на специалистов Java и JavaScript растет значительно быстрее. Распределение спроса на ИТ-навыки по вакансиям: веб-разработка 43 %, Cloud/DevOps 41 %. Разработанная структура предоставляет образовательным учреждениям и государственным органам доказательную базу для согласования развития навыков с цифровой экономикой.</p>
