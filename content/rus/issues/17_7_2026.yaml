     <p>Рассмотрены принципы построения и подходы к реализации инструментального средства, предназначенного для анализа отклонения учебных планов подготовки ИТ-специалистов от идеально гармонизированного эталона. Под гармонизацией понимается согласование структуры учебного плана по содержательным, логическим, временным и методическим параметрам, обеспечивающее целостность образовательного процесса и отсутствие дублирования. Пред­ставлена математическая модель идеально гармонизированного учебного плана, основанная на многокритериальной оптимизации, включающей показатели преемственности дисциплин, индекса дублирования и когезии графа дисциплин.
     Проведен эксперимент на примере направления 09.03.01 «(Информатика и вычислительная техника» ПНИПУ, показавший, что использование предложенной модели позволяет количественно оценить отклонение учебного плана от эталона и выявить узкие места, требующие содержательной и организационной коррекции. Результаты демонстрируют потенциал предложенного подхода для совершенствования планирования образовательных программ и повышения их внутренней согласованности.</p>
