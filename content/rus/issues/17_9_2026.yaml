     <p>Представлены классическая теория архитектуры сверточных нейронных сетей и алгоритмы их глубокого обучения на практических примерах их реализации с использованием современных библиотек и фреймворков для работы с нейронными сетями. Рассмотрены варианты установки и использования программного обеспечения нейронных сетей из облачных сервисов и хранилищ. На примере экосистемы Ultralytics YOLO рассмотрена топология сети и даны характеристики используемых нейронных слоев. Раскрыты особенности операций монтирования и настройки устройств локальной машины к виртуальной машине Google Colab в целях обучения сверточной нейронной сети YOLO. Представленный в статье алгоритм обучения демонстрирует, что успешное применение нейронных сетей сегодня строится на симбиозе понимания их внутреннего устройства, эффективного использования высокоуровневых инструментальных средств вычислительных платформ и облачных сервисов.</p>
