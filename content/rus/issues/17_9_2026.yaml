   item_annot: |
     <p>Представлены результаты исследования, направленного на повышение эффективности и надежности централизованного сбора и аналитической доступности диагностических данных в распределенных информационных системах. Рассмотрены локальные решения на базе Syslog, брокерные платформы, архитектурные подходы и технологические стеки. Описана разработанная система централизованного журнализирования событий, объединяющая легкий локальный сбор логов, асинхронную передачу и масштабируемое централизованное хранение. По сравнению с локальными Syslog-решениями система обеспечивает накопление и аналитическую обработку журналов в едином контуре, а по сравнению с брокерными платформами снижает сложность развертывания и эксплуатации в условиях средних и низких нагрузок. Система реализована на языке Go с использованием фреймворка Gorilla. Предложена сегментированная архитектура хранения на базе ClickHouse с балансировкой нагрузки по алгоритму Round Robin. Экспериментальные результаты подтвердили стабильность сбора событий, доступность журналов для анализа и сбалансированное соотношение пропускной способности, надежности и инфраструктурной сложности.</p>
