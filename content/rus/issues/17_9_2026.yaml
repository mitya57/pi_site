     <p>Статья посвящена решению актуальной задачи персонализации образовательных программ в сфере подготовки ИТ-специалистов. Для ее решения предложен программный модуль, интегрируемый в систему управления обучением Moodle, взаимодействующий с внешним FastAPI-сервером и предобученной нейросетевой моделью для автоматизированного построения индивидуальных образовательных траекторий на основе анализа стартовых компетенций обучающихся. Сформулированы требования к модулю, на основе которых выполнена его разработка с использованием event-dhven-архитектуры. Описаны функциональная модель, архитектура системы, информационное и программное обеспечение. Приведены результаты сравнительной экспериментальной оценки эффективности модуля, продемонстрировавшие его преимущество по сравнению как с традиционным методом ручного определения образовательной траектории, так и с методом на основе автоматизированных фондов оценочных средств.</p>
