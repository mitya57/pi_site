   item_annot: |
     <p>Рассмотрена задача повышения эффективности методов мониторинга и анализа данных в приложениях реального времени в целях последующего применения высокопроизводительных интеллектуальных алгоритмов на распределенных платформах с мобильными компонентами и автономным питанием. Описана распределенная архитектура многоуровневой обработки данных сенсоров, основанная на представлении интеллектуальной среды как множества состояний. В рамках этой архитектуры периферийные вычислительные устройства выявляют данные сенсоров, которые могут содержать новые знания. Представлены алгоритмы, позволяющие снизить нагрузку на аппаратную и сетевую инфраструктуры. Сформулирован метод контекстной коррекции результатов классификации.</p>
