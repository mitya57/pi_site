   item_acc_on: 2026-03-17
   item_annot: |
     <p>Представлены результаты разработки интеллектуальной информационно-справочной системы, основанной на архитектуре Retrieval-Augmented Generation (RAG), предназначенной для оперативного информирования населения при паводках. Рассмотрены существующие решения, которые не обеспечивают персонализированных рекомендаций и не позволяют гражданам быстро ориентироваться в сложной ситуации. Представлены особенности архитектуры разработанной системы, обеспечивающей интеграцию официальной информации и поддержку персонализированного информирования пользователей через интеллектуальный Telegram-бот. Описаны методы обработки данных, векторный поиск, мультиагентная RAG-архитектура и результаты тестирования. Показано, что внедрение системы позволяет повысить точность, скорость и персонализированность информирования граждан при паводках.</p>
