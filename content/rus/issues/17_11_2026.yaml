   item_rec_on: 2026-03-26
   item_acc_on: 2026-06-16
   item_annot: |
     <p>Представлено решение задачи краткосрочного прогнозирования технологических параметров на уровне программируемого логического контроллера (ПЛК). Предложен способ реализации нейросетевой модели LSTM на уровне ПЛК, который позволит сократить время задержки при обработке данных и оперативно выявлять отклонения от нормальных режимов. В результате обучения модели были получены весовые коэффициенты и размеры смещений нейронов, которые использовались для построения прогноза на ПЛК. Разработана библиотека LSTM-модели на языке ST, включенном в стандарт МЭК 61131-3. Результаты продемонстрировали возможность реализации нейросетевых моделей, в частности LSTM, на уровне ПЛК без негативного вклада в быстродействие системы.</p>
