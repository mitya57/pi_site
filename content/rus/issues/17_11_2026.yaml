     <p>Рассмотрена задача персонализации обучения в адаптивных интеллектуальных обучающих системах (АИОС) на примере технических дисциплин, характеризующихся высокой долей практических задач. Предложен замкнутый контур управления, основанный на многомерной динамической модели студента (ДМС), объединяющей когнитивные, физиологические, мотивационные и профессиональные характеристики студентов.
     Модель позволяет на начальном этапе работы с АИОС настроить интерфейс, контент и тесты под каждого студента, а в процессе обучения непрерывно корректировать их на основе поведенческих и определяющих уровень знаний метрик. Такой подход реализует трехстороннюю адаптацию, которая направлена на приведение интерфейса, учебного материала и тестовых заданий в соответствие с текущими характеристиками студента.
     Интеллектуальный характер подхода обеспечивает замкнутый контур управления с искусственной нейронной сетью в качестве ядра принятия решений, преобразующей данные ДМС в персонализированные настройки интерфейса, контента и тестов. Экспериментальная проверка АИОС на базе университета при обучении техническим дисциплинам показала, что использование ДМС обеспечило значительное повышение успеваемости, снижение когнитивной нагрузки и улучшение эмоционального состояния студентов.</p>
