     <p>Представлено решение задачи повышения эффективности управления проектами по цифровизации промышленного предприятия в условиях структурной сложности его организации, множества взаимных связей между показателями хода выполнения проектов и существенной доли их качественных характеристик. Для рассматриваемого сценария управления проектами по цифровизации определены основные характеристики, влияющие на эффективность управления, а также релевантные параметры среды. Предложен формальный подход, основанный на использовании аппарата системной динамики и нелинейных дифференциальных уравнений. Такой подход позволяет моделировать во времени основные характеристики процесса управления проектами, а также определить план мероприятий, минимизирующий целевую функцию задачи. В качестве такой функции рассмотрена взвешенная интегральная мера отклонения основных характеристик от рекомендованных руководителем проекта. Разработан программный комплекс, реализующий численное решение системы нелинейных дифференциальных уравнений методом Рунге—Кутты. Использование этого комплекса позволяет определить значение оптимизируемой целевой функции задачи в зависимости от выбранных управляющих воздействий в виде планов мероприятий при известных параметрах среды. На модельном примере для проекта цифровизации промышленного предприятия АО «Трансмаш» (г. Энгельс) на различных временных интервалах продемонстрирована возможность прогнозирования изменений основных характеристик проекта, а также выбора наилучшего плана мероприятий, используемого для его реализации.</p>
