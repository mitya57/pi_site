   item_annot: |
     <p> Представлена интеллектуальная система речевого взаимодействия пользователей, объединяющая модификацию и распознавание речи в реальном времени для повышения качества коммуникации при использовании нескольких языков и их смеси, иностранного акцента и специализированной предметно-ориентированной лексики. Рассмотрена архитектура на основе моделей распознавания и конвертации речи, коррекции произношения, перевода из речи в речь, предусматривающая изменения исходного речевого сигнала для улучшения его восприятия и повышения точности распознавания. Формализован показатель уровня коррекции, отражающий глубину модификации речи — от изменения акцента до коррекции произношения и полного перевода речи с одного языка на другой. Приведена оценка влияния различных уровней коррекции речи на задержки при обработке. Практическая реализация и испытания в условиях кол-центра подтвердили эффективность предложенного подхода, что позволило снизить число ошибок при распознавании речи и обеспечить приемлемую задержку, удовлетворяющую требованиям современных систем голосового общения в реальном времени.</p>
