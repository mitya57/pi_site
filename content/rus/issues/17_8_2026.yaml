     <p>Предложен набор данных FakeMeet, предназначенный для оценки устойчивости алгоритмов выявления подмены лица в видеозаписях в условиях видеоконференций. Набор воспроизводит типичные условия видеосвязи за счет моделирования искажений при смене разрешения и при кодировании H.264 с различной степенью сжатия, а также за счет вариативности фона. Проведено экспериментальное сравнение четырнадцати современных детекторов в режиме переноса на наборы данных Celeb-DF и FakeMeet. Показано, что в условиях, характерных для видеоконференций, качество распознавания заметно снижается. Полученные результаты подчеркивают необходимость разработки устойчивых подходов, сохраняющих надежность при сдвигах разрешения, появлении артефактов сжатия и использовании различных методов генерации. Набор FakeMeet задает стандартизированную, привязанную к реальному сценарию основу для дальнейшего развития средств защиты цифровых коммуникационных платформ от эволюционирующих угроз подмены личности в видеозаписях.</p>
