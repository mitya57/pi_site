   item_annot: |
     <p>Рассмотрена проблема размещения множества легких Node.js-приложений на одном сервере в условиях, когда полноценная контейнерная оркестрация (Kubernetes, Docker Swarm) создает избыточные накладные расходы. Предложен подход процессной оркестрации, при котором каждое приложение запускается как отдельный процесс операционной системы под управлением единого сервера приложений, реализованного на Kotlin / Spring Boot. Описаны архитектура системы Node Orchestrator, включающая REST API развертывания, механизм обратного проксирования через nginx, автоматическое восстановление упавших процессов, а также модуль интеллектуального мониторинга, включающий обнаружение аномалий в метриках процессов на основе алгоритма Isolation Forest для превентивного перезапуска и адаптивное управление задержкой cooldown на основе истории сбоев. Проведенные эксперименты демонстрируют работоспособность прототипа и его преимущества по потреблению ресурсов в сравнении с контейнерным подходом. Результаты показали, что процессная оркестрация в сочетании с AI-компонентами может являться практичной альтернативой для сценариев размещения небольших Express.js-сервисов.</p>
