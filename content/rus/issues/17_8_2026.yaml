   item_annot: |
     <p>Рассмотрено исследование, целью которого является повышение эффективности и безопасности взаимодействия в клиент-серверных медицинских информационных системах за счет использования разработанного программного модуля доверенного диспетчирования. Функционирование модуля демонстрируется на примере программной системы «(Интеллектуальный ассистент врача УЗИ щитовидной железы», где он обеспечивает безопасное, надежное и управляемое взаимодействие между компонентами распределенной микросервисной архитектуры. Модуль объединяет функции управления подписками, обработки платежных транзакций и контроля доступа. В качестве основного языка реализации выбран Golang, благодаря его производительности и встроенной поддержке многопоточности. Для межсервисного взаимодействия используется фреймворк удаленного вызова процедур gRPC с применением двустороннего протокола TLS, что гарантирует аутентификацию и конфиденциальность обмена данными. Интеграция с внешними платежными провайдерами реализована через безопасные автоматически формируемые сообщения (вебхуки) и идемпотентные запросы, исключающие дублирование операций. Архитектура модуля построена на принципах чистой архитектуры, что обеспечивает гибкость, тестируемость и независимость бизнес-логики от инфраструктурных деталей. Развертывание системы автоматизировано с использованием контейнера Docker и механизма Docker Compose. Предложенное решение повышает уровень безопасности медицинских данных, упрощает управление доступом и обеспечивает масштабируемость системы в условиях роста числа пользователей и объема транзакций.</p>
