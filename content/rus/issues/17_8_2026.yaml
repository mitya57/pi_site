   item_annot: |
     <p>Предложена методика обнаружения атак на веб-приложения, основанная на последовательном (поэтапном) применении двух моделей, различающихся по назначению и вычислительной сложности. Первый этап выполняет бинарную фильтрацию HTTP-запросов и предназначен для оперативного исключения легитимного трафика из дальнейшей обработки. Второй этап применяется только к запросам, признанным подозрительными, и решает задачу многоклассовой классификации, выявляя тип атаки. Предложенный подход ориентирован на устранение одного из серьезных ограничений существующих решений, заключающегося в разрыве между высоким качеством классификации и практической применимостью модели при обработке интенсивного потока HTTP-запросов.</p>
