   item_annot: |
     <p>Рассмотрены модели и программные средства моделирования металинзы с использованием метода конечных разностей во времени FDTD (Finite-Difference Time-Domain) в программном пакете MEEP. Металинзы, основанные на использовании метаповерхностей, обеспечивают возможность управления фазой и амплитудой электромагнитных волн на субволновом масштабе и находят применение в нанофотонике, оптических коммуникациях и квантовых технологиях. Проведен анализ параметров элементарной ячейки металинзы, включающих высоту и длину стороны основания, а также определены оптимальные геометрические размеры, обеспечивающие максимальный коэффициент пропускания и полный фазовый диапазон. На основе полученных данных построена модель полной линзы, выполнено ее численное моделирование, а также рассчитаны характеристики фокусировки. Результаты показали эффективность предложенного подхода и подтвердили возможность использования метода FDTD для моделирования металинз с заданными свойствами. Дополнительно показано, что металинза сохраняет стабильные характеристики фокусировки в широком спектральном диапазоне 840...1240 нм, что свидетельствует об отсутствии заметной хроматической аберрации в данном диапазоне.</p>
