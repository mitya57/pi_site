   item_annot: |
     <p>A mathematical model and algorithm for emotion analysis are proposed. The results of developing a software package for analyzing the emotional state of learners in an immersive environment are described. A comparative analysis of existing solutions for recognizing emotional states was conducted, leading to the selection of the py-feat library (Detector module) as the one that best meets the requirements for comprehensive analysis and research re-producibility. An experiment assessing the user's emotional state while working with a multimedia simulator revealed the predominance of negative affective states. The obtained data are interpreted in the context of status functions concept, which are temporary complex-valued functions that form an orthonormal basis for acceptable system states. This revealed a systematic shift from neutral status to frustration.</p>
   item_keywords: immersive technologies, emotional state, affective state, adaptive learning, emotional analysis, virtual reality, status functions
