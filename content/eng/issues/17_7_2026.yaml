   item_acc_on: December 18, 2025
   item_annot: |
     <p>This article examines the design principles and implementation approaches for a tool designed to analyze devia­tions of IT specialist curricula from a perfectly harmonized standard. Harmonization refers to the alignment of curriculum structure across substantive, logical, temporal, and methodological parameters, ensuring the integrity of the educational process and the absence of duplication. A mathematical model of a perfectly harmonized curriculum is presented, based on multicriteria optimization, including indicators of discipline continuity, duplication index, and discipline graph cohesion.
     An experiment was conducted using the example of the 09.03.01 "Informatics and Computer Engineering" program at Perm National Research Polytechnic University. This experiment demonstrated that the proposed model allows for a quantitative assessment of curriculum deviations from the standard and the identification of bottlenecks requiring substantive and organizational correction. The results demonstrate the potential of the proposed approach for improving educational program planning and enhancing their internal consistency.</p>
