   item_annot: |
     <p> The purpose of this article is to increase the efficiency and security of interaction in client-server medical information systems (MIS) through the use of the developed trusted dispatching software module. The module's operation is demonstrated using the example of the Intelligent Thyroid Ultrasound Physician's Assistant software system, where it provides secure, reliable, and manageable interaction between components of a distributed microservice architecture. The module integrates subscription management, payment transaction processing, and access control functions. Go-lang was chosen as the main implementation language, due to its performance and built-in competitiveness support. For inter-service interaction, the gRPC (Google Remote Procedure Call) framework is utilized with the mutual TLS (transport layer security) protocol, which guarantees authentication and confidentiality of data exchange. Integration with external payment providers is implemented through secure automatically generated messages (webhooks) and idempotent requests that eliminate duplication of operations. The architecture of the module is based on the principles of pure architecture, which ensures flexibility, testability and independence of business logic from infrastructure details. The system deployment is automated using the Docker container and the Docker Compose tool. The proposed solution increases the level of security of medical data, simplifies access management and ensures the scalability of the system in the face of an increasing number of users and transaction volume.</p>
   item_keywords: trusted dispatching, microservice architecture, data security, billing, Golang, gRPC, medical information systems
