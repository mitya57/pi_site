     <p>The FakeMeet dataset is proposed for evaluating the robustness of face-swapping detection algorithms in video recordings under video-conferencing conditions. FakeMeet recreates typical video-call conditions by modeling distortions caused by resolution changes and by H.264 encoding with different compression levels, and it also includes variation in the background. An experimental comparison of fourteen modern detectors is conducted in a cross-domain evaluation setting on the Celeb-DF and FakeMeet datasets. It is shown that, under conditions characteristic of video conferencing, detection performance noticeably decreases. These findings point to the need for stable approaches that remain reliable under resolution shifts, compression artifacts, and the use of different generation methods. FakeMeet provides a standardized, scenario-specific benchmark to drive advancements in securing digital communication platforms against evolving deepfake threats.</p>
