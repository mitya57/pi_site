   item_annot: |
     <p>This study presents the numerical modeling and analysis of a metalens using the finite-difference time-domain (FDTD) method implemented in the MEEP simulation package. Metalenses, which rely on planar metasurfaces composed of subwavelength nanostructures, offer unprecedented control over the phase, amplitude, and polarization of electromagnetic waves and represent a promising alternative to conventional refractive optics. Their flat architecture and compatibility with nanophotonic technologies enable the realization of ultra-compact, lightweight, and multifunctional optical systems suitable for imaging, communication, and quantum applications.
     In this work, the optical response of the metalens unit cell was examined by varying its geometric parameters, such as height and side length. Through FDTD simulations, the optimal configuration was identified that provides high transmission efficiency together with a complete [0, 2n] phase modulation range required for precise wavefront engineering. Using the optimized unit cell, a complete metalens structure was designed and analyzed to evaluate its focusing characteristics.
     Importantly, the metalens demonstrated stable and consistent focal properties across the wavelength range from 840 to 1240 nm, indicating the absence of significant chromatic aberration within this spectral band. The focusing performance remained nearly unchanged, confirming the robustness of the design over a broad operational bandwidth.
     Overall, the results verify the effectiveness of the proposed design approach and highlight the capability of the FDTD method to accurately model metalens behavior. This work emphasizes the potential of MEEP-based simulations in the development of next-generation, compact, high-efficiency, and broadband optical components.</p>
