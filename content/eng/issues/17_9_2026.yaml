   item_annot: |
     <p>The article addresses the pressing challenge of personalizing educational programs in the field of IT specialist training. To tackle this issue, the authors propose a software module that integrates into the Moodle learning management system and interacts with an external FastAPI server and a pre-trained neural network model to automate the construction of individual educational trajectories based on an analysis of students' initial competencies. Requirements for the module are formulated, and its development is carried out using an event-driven architecture. The functional model, system architecture, and information and software components are described. The results of a comparative experimental evaluation of the module's effectiveness are presented, demonstrating its advantages over both the traditional method of manual educational trajectory determination and the approach based on automated assessment funds.</p>
