   item_annot: |
     <p>Substantial volume of sensed data available and high complexity of data analysis methods create a need for increasing the effectiveness of monitoring and data selection for real-time application with the aim for deploying the high-complexity algorithms on distributed platforms with mobile components and autonomous power supply. The paper describes a distributed architecture for multi-level processing of these raw data, based on the presentation of the intellectual environment as a set of states. The algorithms have been developed as well to reduce the load on hardware and network infrastructure and to improve the accuracy of data classification through contextual correction of intellectual classification results.</p>
   item_keywords: sensor, data analysis, holistic approach, architecture, delay, algorithm, context-aware method
