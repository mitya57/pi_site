   item_annot: |
     <p>The paper describes normative academic workload calculation in an information system of an educational institution. A formal model is proposed that connects working curriculum rows, student counts, streams, subgroups, manual adjustments, and workload profile coefficients. The paper shows how source rows are transformed into calculated workload rows, how partial workload components are computed, and how final values are generated. The software implementation is described through the layers of data extraction, normalization, calculation core, version storage, and result control. The novelty of the work is the formal preservation of links between a working curriculum row, a transformation rule, a calculation version, and a final workload row. The practical basis of the work is an information system developed by one of the authors. The operational verification presented in the paper is based on data from Saint Petersburg State Marine Technical University. The use of similar solutions at Ufa University of Science and Technology and Bashkir State Medical University shows the transferability of the approach. A numerical example is provided to show the calculation procedure and control conditions. The model prepares reproducible workload values for subsequent departmental distribution, reporting, and management control.</p>
