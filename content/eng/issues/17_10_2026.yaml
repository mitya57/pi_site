   item_annot: |
     <p> The effectiveness of using scientometric information and analytical systems to support administrative and managerial decision-making in scientific organizations directly depends on the quality of data on the publication activity of individual authors. With a significant increase in the number of Chinese authors in international publications, the issue of systematic errors in identifying their names has become relevant. This is largely due to the differences between the traditional Chinese ("Last Name — First Name") and Western ("First Name — Last Name") order of name components, the multiple romanization systems, and the so-called "double ambiguity" where both parts of the name can be identified as last names.
     The article proposes a customized deterministic model for verifying the order of name components, implemented as an aggregation procedure of interpretable evidence based on scoring logic with calibrated weights, thresholds, and a pre-check that the name is Chinese.</p>
