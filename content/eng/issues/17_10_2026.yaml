     <p>A specialized new heuristic method is proposed for the outer estimation of the united solution set of an interval system of linear algebraic equations (ISLAE). The Method of Extreme Matrices (MEM) is based on vertex realizations of interval matrices formalized from products of matrix elements and their cofactors. The conditions for the emergence of a bounded subset of extreme matrices possessing identical characteristics are established. Based on the constructed matrices, optimal right-hand side vectors are determined.
     Solving the resulting real-valued systems of equations enables the determination of the maximal coordinates of the deviation polyhedron of unknowns in the space Rn, which define the outer estimation of the ISLAE solution set.
     A theoretical justification of the method is provided, and the theorem on the existence of extreme matrices is proven. Classes of ISLAEs adapted for the proposed study are identified.
     The efficiency of the method is achieved through a substantial reduction in the number of algebraic equations required for computing outer estimations of the ISLAE solution set, replacing the solution of an exponentially complex problem O(2n2) with a polynomial-complexity problem O(n3).
     The influence of structural properties of matrices belonging to specific subclasses of interval systems on the obtained solution estimates is demonstrated.
     The accuracy of MEM interval estimates is compared with the results of software implementations of interval methods using the functions of the IntvalPy library. The method does not guarantee high accuracy, but it allows comparable estimates to be obtained for different classes for interval linear algebraic systems in comparison with key interval method.
     Conservative MEM estimates may be used as baseline approximations for further refinement by exact methods.</p>
