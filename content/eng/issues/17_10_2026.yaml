   item_annot: |
     <p>The paper addresses the problem of developing software agents based on large language models capable of automatically performing individual operations related to software code modification, result verification, and accumulation of experience from previous actions.
     An approach to the controlled improvement of software systems is proposed, in which an agent generates hypotheses of code modifications, applies changes to the codebase, executes a testing pipeline, and evaluates the obtained result using a quality assessment function. Process controllability is ensured through fixed experimental conditions, automated verification of modifications, and comparison of different agent behavior strategies.
     For experimental evaluation, the RSI-Bench framework was developed to compare strategies of software agent behavior in code modification tasks. The primary evaluation metric was the success rate of automated test execution. Additionally, computational cost and the number of iterations required to obtain a result were recorded.
     The conducted experiments demonstrated that solution quality depends not only on the selected agent behavior strategy, but also on the underlying language model, the specific agent implementation, and stochastic variability between runs. It was found that self-modification strategies implemented at the level of textual instructions provide a limited and unstable effect. The obtained results may be used in the development of automated software engineering support systems and approaches for assessing the quality of software code modifications.</p>
