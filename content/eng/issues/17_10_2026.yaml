   item_annot: |
     <p>This paper presents a comparative study of two approaches to driver drowsiness assessment from video streams: a classical method based on a convolutional neural network (CNN) and a hybrid method that supplements the neural network classifier with geometric biometric facial features. MobileNetV3-Large is used as the base architecture.
     Biometric features (EAR, MAR, head orientation angles) are extracted using MediaPipe Face Mesh. An adaptive modality fusion mechanism (Fusion Gate) is proposed, dynamically weighting the contributions of visual and biometric features.
     The integration of biometric indicators addresses limitations of pure CNN approaches under varying lighting, pose, and occlusions, which are common in real-world driving scenarios. Driver drowsiness is a major contributor to road accidents, with human factors causing over 99 % of incidents and microsleep episodes posing particular risks. Experi­ments on publicly available datasets showed that the hybrid method significantly improves performance, achieving an accuracy of 98.7 % (F1 = 0.987) compared to 96.0 % (F1 = 0.958) for the baseline CNN.
     The results justify the feasibility of using hybrid architectures in driver state monitoring systems, particularly for real-time embedded applications in advanced driver assistance systems (ADAS). This approach enhances robustness and supports safer intelligent transportation systems by better handling human factors contributing to road accidents, offering a practical solution for mass deployment in vehicles.</p>
