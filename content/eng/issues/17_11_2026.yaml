   item_annot: |
     <p>The article considers the problem of improving the efficiency of project management for the digitalization of an industrial enterprise in conditions of high structural complexity, multiple feedback loops, and a significant share of qualitative (hardly formalizable) factors. We propose a formal approach based on system dynamics and nonlinear differential equations. This approach allows us to model the key characteristics of management efficiency and software quality over time, as well as to select an action plan that minimizes the weighted integral measure of deviation from the values recommended by the decision-maker, subject to specified constraints and boundary conditions. We have developed a software package that implements the numerical solution of a system of equations using the Runge—Kutta method and the calculation of the objective function using numerical methods. Using a model example of a digitalization project for an industrial enterprise, we demonstrate the possibility of predicting the dynamics of indicators and comparing alternatives.</p>
   item_keywords: system dynamics, project management, digitalization of an industrial enterprise, management efficiency, fuzzy logic, differential equations
