   item_annot: |
     <p>The article addresses the problem of personalized learning in adaptive intelligent learning systems (AILS) using the example of technical disciplines characterized by a high proportion of practical tasks. A closed-loop control framework based on a multidimensional dynamic student model (DSM) is proposed, which integrates cognitive, physiological, motivational, and professional characteristics of student's.
     The model allows the system to tailor the interface, content, and tests to each student at the initial stage of working with the AILS, and to continuously adjust them during the learning process based on behavioral and knowledge-related metrics. This approach implements a threefold adaptation aimed at aligning the interface, educational material, and test tasks with the of student's current characteristics.
     Intelligence is ensured by a closed control loop with an artificial neural network (ANN) as the core decision-making engine, which transforms DSM data into personalized settings for the interface, content, and tests. Experimental validation of the AILS at a university in teaching technical disciplines showed that using the DSM led to a significant increase in academic performance, a reduction in cognitive load, and an improvement in student's emotional state.</p>
