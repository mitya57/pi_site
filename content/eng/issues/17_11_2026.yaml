   item_annot: |
     <p>One of the most acute challenges in the software engineering field is the low success rate of projects, which remains at around 30 % for decades. This problem is commonly attributed to the high volatility of requirements and the resulting complexity of project management in software engineering. To address uncertainty, iterative-incremental development methods such as SCRUM have become widespread. The quality of iteration planning is crucial while using these methods. However, it relies heavily on expert judgment and subjective estimates, making it vulnerable to cognitive biases and errors. It makes automating iteration planning an actual research area.
     Existing approaches still depend strongly on user-defined, i. e. subjective, priorities, and do not target project progress. However, this paper proposes an approach for automated iteration planning maximizing project progress using a formal project model defined by the oMg Essence standard and a Bayesian network.
     Project progress level is modeled as the sum of confidence levels of achieving Essence Kernel alpha checkpoints, weighted by expert estimates of their relative effort and importance. Planning is reduced to selecting a subset of states of sub-alphas and levels of detail of work products, which are used as evidences, so as to maximize project progress level under iteration effort constraints.
     The problem is shown to be related to the knapsack problem, with approximate solutions obtained via dynamic programming. Experimental examples on modeled data demonstrate that the algorithm produces reasonable iteration plans. Some significant comments on the OMG Essence standard are made, including alphas' unequal importance and lack of attributes related to time estimation.</p>
   item_keywords: OMG Essence, project management, Bayesian network, SCRUM, sprint planning, knapsack problem, iteration plan, iteration
