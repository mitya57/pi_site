   item_annot: |
     <p>The article is devoted to the problem of short-term forecasting of technological parameters at the level of a programmable logic controller (PLC). Real-time analysis of process signals is infeasible due to latency in the network infrastructure between industrial control system (ICS) levels, as well as delays in measurement channels. The paper proposes implementing an LSTM neural network model at the PLC level, which makes it possible to optimize data handling time and promptly detect deviations from normal operating modes. An implementation of the LSTM model architecture on a PLC is presented for forecasting time series of process parameters. The LSTM model, developed in the high-level Python language, was trained on 110 hours of historical data sampled at one-minute intervals. Training yielded weight coefficients and neuron bias values that were used to generate forecasts on the PLC. An LSTM model library was developed in Structured Text (ST) as defined by the IEC 61131-3 standard. For the obtained results, forecast metrics were computed — both on the upper-level server and on the PLC — against the test data, and forecasting performance indicators are reported. The results demonstrate the feasibility of implementing neural network models, in particular LSTM, at the PLC level without adversely affecting system performance.</p>
   item_keywords: forecasting, neural networks, PLC, time series, IEC 61131-3, LSTM
